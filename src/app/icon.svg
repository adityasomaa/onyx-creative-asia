<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 154" width="256" height="154">
  <!--
    Favicon, no plate behind the mark.

    A transparent monochrome mark can only be visible on one kind of tab
    strip, and browsers have both: light in light mode, near-black in
    dark. So the dark mark is embedded once and inverted by media query
    rather than shipping two files that could drift apart. invert()
    touches the colour channels only, so the transparency survives.

    Default is the dark mark, which is the right answer when a browser
    reports no preference: tab strips are light more often than not.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      image { filter: invert(1); }
    }
  </style>
  <image href="data:image/png;base64," width="256" height="154"/>
</svg>
